name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  suite:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[pdf]"
      - run: python -m unittest discover -s tests -v
      - name: Check the Build API with Docker
        if: runner.os == 'Linux'
        env:
          WORKBENCH_DOCKER_TESTS: "1"
        run: |
          docker pull python:3.13-alpine
          python -m unittest discover -s tests -p test_build_docker.py -v
